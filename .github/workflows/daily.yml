name: daily-digest

on:
  schedule:
    - cron: "0 14 * * *"   # 매일 14:00 UTC (필요시 조정)
  workflow_dispatch: {}      # 수동 실행 버튼
  # 디자인/템플릿만 바꿨을 때 **API 비용 없이** 배포하는 경로(2026-08-06 추가).
  # 파이프라인·커밋 스텝은 아래 `if: github.event_name != 'push'` 로 건너뛰고, 이미 커밋된
  # output/ 을 그대로 Pages 에 올린다.
  #
  # ⚠️ 그래서 **로컬에서 `python rerender.py` 로 output/ 을 갱신해 같이 커밋해야 한다.**
  #    템플릿만 고치고 output/ 을 안 구우면 예전 지면이 그대로 다시 배포된다(빌드가
  #    렌더를 다시 하지 않는다 — 그게 이 트리거가 싼 이유다).
  #
  # 무한 루프는 없다: cron 실행이 스스로 push 하는 `digest: <날짜>` 커밋은 GITHUB_TOKEN 으로
  # 만들어지고, GitHub 은 GITHUB_TOKEN 이 만든 이벤트로 새 워크플로 실행을 시작하지 않는다.
  push:
    branches: [main]

permissions:
  contents: write            # output/ 와 digest.db 커밋용

# 그룹 이름을 레포 고유값으로 바꿨다(2026-08-06). 예전 값은 Pages 스타터 워크플로에서 그대로
# 가져온 `"pages"` 였는데, 동시성 그룹은 **레포 전역**이라 같은 이름을 쓰는 다른 워크플로와
# 경쟁한다. 지금 이 레포에는 GitHub 이 만든 내장 `pages-build-deployment`(event: dynamic)가
# 새로 등록돼 있고, Pages 스타터 계열은 관례적으로 같은 `"pages"` 그룹을 쓴다.
# 2026-08-06 에 두 워크플로가 겹쳐 돌다 **둘 다 cancelled** 로 끝났다 — 그게 그룹 충돌 때문인지
# 손으로 취소한 건지는 인증 없이 확인할 수 없었다. 다만 범용 이름을 계속 쓸 이유가 없고
# 바꾸는 비용이 0 이라, 가능성 하나를 그냥 없앤다.
concurrency:
  group: "ai-digest-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 2026-08-06 실패는 러너가 죽어 통신이 끊긴 형태였다. 상한이 없으면 이런 실행이 기본
    # 6시간을 붙잡고 있을 수 있다. 정상 실행은 10분 안쪽이라 30분이면 넉넉하다.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # push 트리거(디자인 배포)에서는 파이썬도 의존성도 필요 없다 — 렌더를 다시 하지 않고
      # 커밋된 output/ 을 그대로 올리기 때문. requirements.txt 는 torch 를 끌어와서 무겁다.
      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip

      # torch 를 **CPU 전용 인덱스에서 먼저** 깐다. 이유(2026-08-06 실패 조사):
      # PyPI 기본 리눅스 휠은 CUDA 빌드다 — torch 526MB + cudnn 366 + nccl 206 +
      # cusparselt 170 + triton 198 + nvshmem 60 ≈ 휠만 1.5GB, 게다가
      # `cuda-toolkit[cublas,cudart,cufft,...]` 11종이 더 붙는다. 압축을 풀면 몇 GB다.
      # **러너에는 GPU 가 없고** 우리가 하는 일은 22MB MiniLM 을 CPU 로 돌리는 것뿐이라
      # 이 스택은 전부 낭비이고, 디스크/메모리 압박이 러너를 죽이는 원인으로 가장 유력하다.
      # CPU 휠은 191MB 하나 + nvidia 의존성 0.
      # 순서가 중요하다: torch 를 먼저 만족시켜 놓으면 아래 requirements 설치가
      # sentence-transformers 의 `torch>=1.11` 을 이미 충족된 것으로 보고 CUDA 판을 안 끌어온다.
      # 버전 범위는 requirements.txt 의 torch 줄과 **같이 맞춰야 한다**(두 곳이다).
      - name: Install torch (CPU-only — 러너에 GPU 가 없다)
        if: github.event_name != 'push'
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.13,<2.14"

      - if: github.event_name != 'push'
        run: pip install -r requirements.txt

      # 실패 진단용. 2026-08-06 실패는 러너가 통째로 죽어서(“lost communication”) 스텝 로그에
      # 원인이 남지 않았다 — 디스크/메모리를 남겨 두면 다음엔 한눈에 보인다. 몇 줄이라 싸다.
      - name: Runner resources
        if: github.event_name != 'push'
        run: |
          echo "--- disk ---";   df -h / | tail -1
          echo "--- memory ---"; free -m
          python -c "import torch; print('torch', torch.__version__)"
          python -c "import sentence_transformers as s; print('sentence-transformers', s.__version__)"

      # 인증: Developer API 키. llm.py 의 genai.Client() 가 GEMINI_API_KEY 를 자동으로 집어감.
      # (Vertex AI 서비스계정 방식은 2026-07-28 에 철회 — PROJECT_MEMO 변경로그 참고)
      - name: Run pipeline
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIGEST_MODEL: gemini-2.5-flash
        run: python pipeline.py

      - name: Commit digest + state
        if: github.event_name != 'push'
        run: |
          git config user.name "digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output/ digest.db
          git commit -m "digest: $(date -u +%F)" || echo "변경 없음"
          # 커밋이 없으면 push 도 건너뜀. 동시 실행/수동 커밋과 겹칠 때를 대비해 rebase 후 재시도.
          if git diff --quiet HEAD origin/${GITHUB_REF_NAME}; then
            echo "push 할 것 없음"
          else
            git push || (git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push)
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
