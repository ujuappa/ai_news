# ============================================================
# CATEGORY 4: Policy & business
# ============================================================
policy_business:
  - id: gnews_ai
    name: Google News
    # URL 이 아니라 **검색 질의**. site: 로 좁힌 갭필러 — 공식 피드가 없는 곳만 담당한다.
    #   AP  : index.rss 가 401(유료 라이선스), hub RSS 404 (2026-07-30 실측)
    #   WaPo: tech 피드가 HTTP 200 인데 항목 0건 — 공개 RSS 사실상 폐지
    # Reuters 도 피드가 404 라 후보였지만, 넣으면 100건 중 75건을 Reuters 가 차지해
    # AP/WaPo 를 밀어낸다(2026-07-31 실측) -> 보류.
    feed_url: '(AI OR "artificial intelligence") (site:apnews.com OR site:washingtonpost.com)'
    parse: gnews
    status: verified          # 2026-07-31 재검증: 100건, 발행처 AP 69 / WaPo 31
    enabled: true             # 2026-07-30 비활성 -> 2026-07-31 아래 (1)(2) 수정 후 재활성화
    max_entries: 10           # 항목당 URL 디코딩 비용(~567KB GET + POST)이 커서 25 대신 10
    notes: >-
      2026-07-30 에 껐던 두 버그를 2026-07-31 에 고치고 다시 켬:
      (1) [해결] 날짜: RFC 822("Thu, 30 Jul 2026 10:01:00 GMT")를 못 읽어 published="" 가 되고,
          파싱 실패는 신선도 컷을 통과시키는 설계라 이 소스만 7일 컷을 통째로 우회했었다.
          이제 RSS 를 직접 파싱하므로 feedparser 가 발행일을 알아서 읽는다(_published).
          보험으로 _norm_date 에 parsedate_to_datetime 폴백도 추가.
      (2) [해결] URL: news.google.com 링크는 리다이렉트가 아니라서 resolve_article() 로는 못 푼다
          (실측 4/4 가 같은 주소 반환). fetch.decode_google_news_url() 이 비공개 batchexecute
          RPC 로 실제 기사 URL 을 얻는다. **디코딩 실패 시 아이템을 버린다** — 불투명 링크를
          DB 에 저장하면 본문 추출도 안 되고 사이트에 영구히 남기 때문(2026-07-30 실제 사고).
      (3) [해결] 로컬 NetworkError 는 gnews 라이브러리가 feedparser.parse(url) 을 써서 CA 인증서
          부재에 걸린 것이었음. 이제 라이브러리를 안 쓰고 _parse_feed 를 타므로 무관해짐
          (requirements.txt 에서 gnews 제거).
      (4) [해결] 넓은 키워드의 노이즈 -> site: 두 곳으로 한정.
      ⚠️ (2)의 RPC 는 문서화되지 않은 내부 엔드포인트다. Google 이 바꾸면 조용히 0건이 된다 —
      source-health 배지(raw==0)로 감시하고, 디코딩 실패 건수는 실행 로그에 찍힌다.

  - id: import_ai
    name: Import AI (Jack Clark)
