# ============================================================
# AI News Digest — 소스 설정 파일 (v1) 
# 피드 검증 완료: 2026-07-25
# ============================================================
# status 값:
#   verified  -> 실제로 살아있고 유효한 피드 확인됨
#   verify    -> 표준 형식이라 맞을 가능성 높지만 build 때 첫 fetch로 확인
#   no_feed   -> 공식 RSS 없음. 미러/생성피드/자체파서 필요 (source-health로 감시!)
#
# parse: easy(깨끗한 RSS/JSON) / medium(가끔 부서짐) / hard(스크래핑·트랜스크립트)
# enabled: v1에서 켤지 여부. false = v2 파킹(로드맵 겸용)
# full_text: 기사 페이지에서 본문 추출(trafilatura). 기본 false, 켤 값어치가 있는 소스만 true.
#   비용: 기사 1건당 HTTP 요청 ~0.35s + summary_raw 800->3000자(LLM 입력 토큰 약 3.75배).
#   신선도 컷을 통과한 항목에만 적용됨(fetch._fill_full_text).
#   arXiv 는 RSS 에 초록 전문이 이미 들어와서 이득 없음, hn_ai 는 링크 대상이 임의의 외부
#   사이트라 결과가 들쭉날쭉 -> 둘 다 false 유지.
# ============================================================

settings:
  feeds_verified_on: 2026-07-25
  max_items_per_category: 6
  min_items_fallback: true
  flag_major_at_top: true
  preserve_key_numbers_verbatim: true
  min_significance: 0.25    # 이 미만은 랭킹/상한 전에 드롭 (홍보성/저가치 필터).
                            # 2026-07-27 백필 412건 분석: 0.25 미만 36건(8.7%)이 대부분
                            # 고객사례/템플릿성 페이지("Healthcare", "ChatGPT for marketing teams" 등)
  max_item_age_days: 7      # 일간 파이프라인 전용 신선도 컷오프. 뜸한 소스(Import AI 주간,
                            # Ahead of AI 월간)의 오래된 백로그가 seen-store 리셋 직후
                            # "신규"로 잡혀 significance 만으로 리드 자리를 차지하는 걸 방지
                            # (2026-07-28 발견: 5개월 전 펀딩 뉴스가 리드로 뜬 사고). backfill.py 는
                            # since 파라미터로 직접 호출해서 이 값과 무관.

  # 카테고리별 상한 + 하한. 전역 max_items_per_category/min_significance 는 여기 없는
  # 카테고리의 폴백으로 남는다. 2026-07-30 측정 근거:
  #   research 후보 51건 중 29건이 0.40 에 몰린 일반 arXiv -> 하한 0.55 로 그 덩어리를 걷어내면
  #     10건이 남고 캡 6 이 실제로 작동한다. 하한을 0.60 으로 올리면 통과가 딱 6건이라
  #     캡이 무의미해지고, 점수가 조금만 내려가도 카테고리가 통째로 비어버린다.
  #   policy_business 는 15건 전부 0.50 이상이라 하한은 형식적 -> 10 까지 열어 캡으로 자른다
  #   model_releases(5건)/tools_products(2건)는 공급 부족이라 캡이 안 걸린다 -> 소스가 늘 때를 대비해 10
  categories:
    model_releases:  { max_items: 10, min_significance: 0.30 }
    research:        { max_items: 6,  min_significance: 0.55 }
    tools_products:  { max_items: 10, min_significance: 0.30 }
    policy_business: { max_items: 10, min_significance: 0.40 }

  dedup:
    method: embedding_cosine
    threshold: 0.83                  # 실제 출력 보고 튜닝. 0.80 은 오병합 확인됨(2026-07-29)
    grounding_threshold: 0.78        # grounding 아이템의 "신규성" 판정만 이 값으로 (더 엄격).
                                     # 비대칭인 이유: 본 코퍼스에서 임계값을 낮추면 서로 다른
                                     # 스토리가 병합되는 오류(복구 불가)지만, grounding 은
                                     # "이미 있는 것 같으면 안 넣는다"라서 최악이 보조 1건 누락.
                                     # 2026-07-30 실측: 같은 스토리를 다르게 쓴 라운드업 2건이
                                     # cos 0.8116 이라 0.83 을 통과해 중복 게재됨.
    cross_day: true
    seen_store_retention_days: 14
    thread_min: 0.75                 # [thread_min, thread_max) = "관련 있지만 중복은 아님".
    thread_max: 0.83                 # 상한을 threshold 와 같게 두는 게 핵심 — 그 위는 중복이라
                                     # 이어붙일 게 아니라 합쳐야 한다. 2026-07-30 측정에서
                                     # 이 구간에 든 64쌍은 대부분 후속편이었다
                                     # (Sonnet 4.5->4.6 0.844 는 구간 위, Series G->H 0.829 는 안).
    embedding_retention_days: 180    # seen(14일)과 별개 창. Series G(W07) -> Series H(W22) 처럼
                                     # 몇 달 걸쳐 이어지는 스토리를 잡으려면 이만큼 필요.

  # ⚠️ RSS 피드(output/feed.xml)의 기준 URL. **실제 배포 주소로 맞는지 확인할 것** —
  # RSS 는 상대경로를 허용하지 않아서 이 값이 틀리면 리더에서 모든 링크가 깨진다.
  # 아래는 GitHub Pages 프로젝트 사이트의 기본 형태(레포 ujuappa/ai_news)로 넣어둔 추정값이다.
  # 커스텀 도메인이나 user-site(ujuappa.github.io)면 반드시 바꿀 것. 비우면 피드 생성을 건너뛴다.
  site_url: https://ujuappa.github.io/ai_news
  feed_max_digests: 20      # 피드에 담을 최근 다이제스트 수. 리더는 보통 이 정도면 충분하다

  # Gemini Search Grounding 소스 품질 게이트 (2026-07-31 신설).
  # 왜: grounding 은 이틀 10건 중 8건 게시인데, **07-31 게시분 4건이 전부 라운드업**이었다 —
  #   aiweekly.co/ · buildfastwithai.com/blogs/ai-news-today-july-30-2026 ·
  #   ai.economictimes.com/ · buttondown.com/ai-tldr/archive/aitldr-daily-digest-july-30-2026/
  # significance 0.7~0.9 를 받아서(LLM 이 "AI 뉴스 모음"을 중요한 뉴스로 읽는다) 하한 0.40·캡 10
  # 으로는 안 걸린다. 프롬프트에 primary-source 규칙도 넣었지만 프롬프트는 지켜지지 않을 수 있어서
  # 코드 게이트가 최종 방어선이다(llm._grounding_reject_reason).
  #
  # ⚠️ 맨 도메인(경로 없는 홈페이지)은 이 리스트와 무관하게 항상 버린다 — 07-31 게시 4건 중
  #    3건이 그 경우였고, 새 콘텐츠팜에도 그대로 통하는 유일한 규칙이다.
  # 키를 지우면 llm.py 모듈 기본값이 쓰이고, 빈 리스트([])로 두면 필터가 꺼진다.
  grounding:
    blocked_domains:
      - buildfastwithai.com   # 07-30·31 양일 통과한 "AI news today" 일일 라운드업 팜
      - ainewstoday.com       # 07-31 (캡에 걸려 우연히 안 실림)
      - aiweekly.co           # 07-31 게시됨. 뉴스레터 아카이브
      - crescendo.ai          # 07-31 (하한에 걸려 우연히 안 실림)
      - unrot.co              # 07-30 리뷰에서 관측
      - buttondown.com        # 뉴스레터 호스팅 플랫폼 — 여기 원문이 있을 수 없다
    blocked_url_patterns:     # 새 도메인에도 걸리도록 슬러그로 잡는다
      - ai-news-today
      - news-roundup
      - daily-digest
      - weekly-digest
      - this-week-in
      - ai-news-
      - /newsletter/
      - /digest/

  ranking_rubric:
    - frontier_model_release
    - major_funding_or_acquisition
    - benchmark_record_or_capability
    - notable_policy_shift
    - incremental_research
    - community_reaction

# ============================================================
# CATEGORY 1: Model releases
# ============================================================
model_releases:
  - id: openai
    name: OpenAI News
    feed_url: https://openai.com/news/rss.xml
    parse: easy
    status: verified
    enabled: true
    notes: 구 openai.com/blog/rss.xml 도 작동

  - id: anthropic
    name: Anthropic News
    feed_url: https://www.anthropic.com/sitemap.xml
    parse: sitemap           # RSS 미러(rsshub) 전부 403/timeout -> sitemap.xml + og:title/description 스크레이프로 대체
    status: verified          # 2026-07-27 확인: /news/ 250건, lastmod 2024-05 까지 -> 백필도 가능
    enabled: true
    sitemap_paths:            # 2026-07-30 실측(같은 sitemap): /news 251 · /research 149 · /engineering 25
      - /news/
      - /research/
    notes: >-
      공식 RSS 없음. fetch.py fetch_sitemap_source 가 sitemap.xml 에서 sitemap_paths 에 해당하는
      항목을 lastmod 순으로 스크레이프. 사이트 구조 바뀌면 og:title/description 셀렉터 깨질 수 있음
      -> source-health 감시 유지.
      제외한 경로와 이유:
      (1) /engineering/ (25건) — 페이지에 발행일이 **아예 없다**(2026-07-30 실측: JSON-LD
          datePublished·<time>·datetime 속성·산문 날짜 전부 0건). `_article_published` 가 항상 ''
          을 반환해 lastmod(=리빌드 시각) 폴백만 남는데, 그게 07-28 에 296일 오차를 만든 그 경로다.
          날짜 근거가 생기기 전엔 켜지 말 것.
      (2) /legal/ · /responsible-scaling-policy 등 정책 문서 — 뉴스가 아니라 상시 문서라
          갱신될 때마다 "신규"로 다시 뜬다.
      /research/ 는 발행일 정상 추출 확인(실측 3건 모두 JSON-LD 로 lastmod 와 1~2일 이내 일치).

  - id: deepmind
    name: Google DeepMind Blog
    feed_url: https://deepmind.google/blog/rss.xml      # ★수정됨 (기존 /discover/blog/ 는 틀림)
    parse: easy
    status: verified          # 2026-07-16 최신글까지 실제 피드 확인
    enabled: true
    notes: 대체 URL 후보 https://deepmind.google/blog/feed/basic/

  - id: meta_ai
    name: Meta AI Blog
    feed_url: https://about.fb.com/news/tag/ai/feed/    # Meta Newsroom(WordPress) "ai" 태그 공식 RSS -> ai.meta.com/blog 는 RSS 없지만 이건 정식 피드
    parse: easy
    status: verified          # 2026-07-27 확인: 정상 RSS, AI 관련 항목 확인
    enabled: true
    notes: >-
      ai.meta.com/blog 자체 RSS 는 없음(RSSHub 이슈 #16938 여전). 대신 회사 뉴스룸의 "ai" 태그
      공식 피드 사용 -> 연구 블로그보다 넓은 회사 PR 포함 가능, 카테고리/랭킹으로 필터될 것

  - id: mistral
    name: Mistral AI News
    feed_url: https://rsshub.app/mistral/news           # 공식 피드 없음 -> 생성/미러
    parse: medium
    status: no_feed
    enabled: false           # v1.5
    notes: Olshansk/rss-feeds 의 feed_mistral.xml 참고 가능

# ============================================================
# CATEGORY 2: Research
# ============================================================
research:
  - id: arxiv_ai
    name: arXiv cs.AI
    feed_url: https://rss.arxiv.org/rss/cs.AI
    parse: easy
    status: verified
    enabled: true
    notes: 볼륨 폭탄 -> dedup+랭킹으로 강하게 필터, 상한 낮게. export.arxiv.org 는 cs.AI 만 빈 채널
      반환(arXiv 쪽 버그로 추정, 2026-07-27 확인) -> rss.arxiv.org 로 교체

  - id: arxiv_lg
    name: arXiv cs.LG (Machine Learning)
    feed_url: http://export.arxiv.org/rss/cs.LG
    parse: easy
    status: verified
    enabled: true

  - id: arxiv_cl
    name: arXiv cs.CL (NLP)
    feed_url: http://export.arxiv.org/rss/cs.CL
    parse: easy
    status: verified
    enabled: false           # 넘치면 추가

  - id: hf_daily_papers
    name: Hugging Face Daily Papers
    feed_url: https://huggingface.co/api/daily_papers
    parse: hf_papers
    status: verified          # 2026-07-30 실측: 100건(약 17일치), 초록 평균 1499자, upvote 0~229
    enabled: true
    notes: >-
      arXiv 보완용 — 사람이 고른 목록이고 upvote 가 있어서 수집 단계에서 상위만 남긴다
      (fetch.fetch_hf_papers_source). arXiv 는 사전 품질 신호가 없어 research 후보가 0.40 에
      무더기로 쌓이는데(arxiv_lg 50건 중 36건이 0.40 이하) 그 자리를 대체하는 게 목적.
      upvote 는 후보 선별에만 쓰고 significance 에는 섞지 않음(랭킹 rubric 은 고정).
      URL 은 huggingface.co/papers/{arxiv_id}. 같은 논문이 arXiv 소스와 양쪽에서 들어올 수 있는데
      2026-07-31 실측으로는 arXiv id 기준 중복 0/25 — arXiv 피드는 "가장 최근 25건"을 주고 HF 는
      하루이틀 지나 표가 모인 걸 고르기 때문에 실제로 안 겹친다. 겹치면 dedup 이 제목+초록
      임베딩으로 잡아야 하므로, 중복 게재가 보이면 그때 arXiv id 기준 하드 dedup 을 검토할 것.

  - id: ahead_of_ai
    name: Ahead of AI (Sebastian Raschka)
    feed_url: https://magazine.sebastianraschka.com/feed
    parse: easy
    status: verified          # 활발, Substack 커스텀 도메인
    enabled: true
    notes: 저빈도(월 몇 회). 매일은 안 옴 -> cross-day dedup이 알아서 처리

  - id: the_gradient
    name: The Gradient
    feed_url: https://thegradient.pub/rss/
    parse: easy
    status: verify            # 표준 Ghost 피드. v2라 build때 확인
    enabled: false            # v2 (발행 빈도 낮을 수 있음)

