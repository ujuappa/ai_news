# 하위 폴더를 훑지 않으므로 후보가 아니다 — 지금 고른 게 마음에 안 들면 거기서 꺼내 키 이름으로
# 바꿔 넣으면 된다(예: `extra/TechCrunch-Logo-fullname.png` -> `techcrunch_ai.png`).
